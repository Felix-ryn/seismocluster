name: Build and Push to DockerHub

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login ke DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: felixryan24/seismocluster-backend:latest

      - name: Build dan push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: felixryan24/seismocluster-frontend:latest